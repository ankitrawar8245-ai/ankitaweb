<header>
  Table HTML
</header>
<style>


.ankit{
  font-family: "Playwrite HU";
  FONT-SIZE:30px;
}





  body
  {
    margin:0px;
    padding:0px;
    transition:0.50s;
  }
header
{
  background:black;
  color:white;
  text-align:center;
  padding:12px;
  text-transform:uppercase;
  }

footer{
  background:black;
  color:white;
  text-align:center;
  padding:12px;
  text-transform:uppercase;
  clear:both;
  }
main table
{

     width:95%;
     margin:auto;
     margin-top:40px;
     margin-bottom:40px;
     background:rgb(1, 22, 23);
     color:aliceblue;
     text-align:center;
     font-size:20px;
     font-family:'Times New Roman', Times, serif;
     cursor:pointer;
     height:400px;
   
}
main table tr:hover{
background:rgb(30, 72, 143);
}

main table td:hover
{
  transition:0.50s;
 transform:scale(1.05);
 background:rgb(90, 109, 228); 
 font-size:30px;
}

/* Large devices (laptops/desktops, 992px and up) */
@media only screen and (min-width: 992px)
 {
    body{//background:green;}
    header
    {
      font-size:100px;
    }

  main table
  {
    width:100%;
    border:10px red ridge;
  }
  main table tr td,th
  {
    border:0px;
      border-bottom:1px rgb(55, 156, 174) ridge;
  }

    footer{
      height:200px;
    }

 }


</style>
<body>
  <main>
  <table  border="1" cellpadding="3" cellspacing="2">
    <caption class="ankit" style="color:brown">MARKS </caption>

<tr>
     <th colspan="3" style="background-color:rgb(96, 26, 161)">Modern school</th>
    </tr>

    <tr>
     <th>Roll No</th><th>Name</th><th>Marks</th>
    </tr>
    <tr><td>101</td><td>Ravi Kumar</td><td>450</td></tr>
<tr><td>102</td><td>Arjun</td><td>450</td></tr>
<tr><td>103</td><td>Harri Kumar</td><td>450</td></tr>
<tr><td>104</td><td>Amit</td><td>450</td></tr>
<tr><td>105</td><td>Ashok Sharma</td><td>450</td></tr>
<tr><td>106</td><td>Raj </td><td>450</td></tr>




  </table>

  </main>
  <footer>All Right reserved &reg;</footer>
</body>
